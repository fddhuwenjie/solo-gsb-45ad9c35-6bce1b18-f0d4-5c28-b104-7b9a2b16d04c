<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议室投影机选位工作台</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>📽️ 会议室投影机选位工作台</h1>
  <div class="header-actions">
    <select id="exampleSelect" title="载入内置示例"></select>
    <label class="chk"><input type="checkbox" id="showAll" checked> 显示所有方案区域</label>
    <button id="drawBtn" title="在顶视图中拖拽绘制矩形禁装区">▦ 绘制禁装区</button>
    <button id="delObstacleBtn" title="删除当前选中的禁装区" disabled>🗑 删除禁装区</button>
  </div>
</header>

<main>
  <aside id="panel">
    <section class="card">
      <h2>房间（米）</h2>
      <div class="form-grid">
        <label>宽度 W<input type="number" id="roomWidth" step="0.1" min="1" max="30"></label>
        <label>进深 D<input type="number" id="roomDepth" step="0.1" min="1" max="40"></label>
        <label>净高 H<input type="number" id="roomHeight" step="0.05" min="1.8" max="10"></label>
        <label>墙面余量<input type="number" id="roomMargin" step="0.05" min="0" max="1"></label>
      </div>
    </section>

    <section class="card">
      <h2>幕布（米，可在顶视图拖动）</h2>
      <div class="form-grid">
        <label>幕宽<input type="number" id="screenWidth" step="0.05" min="0.5" max="12"></label>
        <label>幕高<input type="number" id="screenHeight" step="0.05" min="0.4" max="8"></label>
        <label>下沿离地<input type="number" id="screenBottom" step="0.05" min="0" max="5"></label>
        <label>中心位置 X<input type="number" id="screenCx" step="0.05" min="0"></label>
      </div>
    </section>

    <section class="card">
      <h2>镜头方案（二维区域优先 · 安装线次之 · 均在不可行之前）</h2>
      <ul id="schemeList" class="scheme-list"></ul>
      <button id="addSchemeBtn" class="wide">＋ 添加方案</button>
    </section>

    <section class="card" id="schemeEditorCard">
      <h2>方案参数</h2>
      <div class="form-grid">
        <label class="span2">名称<input type="text" id="schName"></label>
        <label>投射比下限<input type="number" id="schTrMin" step="0.05" min="0.1" max="10"></label>
        <label>投射比上限<input type="number" id="schTrMax" step="0.05" min="0.1" max="10"></label>
        <label>水平位移 ±%<input type="number" id="schHShift" step="5" min="0" max="150"></label>
        <label>垂直位移 ±%<input type="number" id="schVShift" step="5" min="0" max="150"></label>
        <label>机身宽 (m)<input type="number" id="schBodyW" step="0.01" min="0.1" max="2"></label>
        <label>机深 (m)<input type="number" id="schBodyD" step="0.01" min="0.1" max="2"></label>
        <label>机身高 (m)<input type="number" id="schBodyH" step="0.01" min="0.05" max="1.5"></label>
      </div>
      <button id="delSchemeBtn" class="danger wide">删除当前方案</button>
    </section>

    <section class="card">
      <h2>镜头高度（侧视图可拖动）</h2>
      <div class="slider-row">
        <input type="range" id="lensHeight" step="0.01">
        <span id="lensHeightVal" class="mono"></span>
      </div>
      <p class="hint" id="lensHeightHint"></p>
    </section>

    <section class="card">
      <h2>禁装区（顶视图）</h2>
      <ul id="obstacleList" class="obstacle-list"></ul>
      <p class="hint">点击「绘制禁装区」后在顶视图拖拽出矩形；拖动可移动，拖动右下角手柄可缩放。</p>
    </section>

    <section class="card" id="pointInfo"></section>
  </aside>

  <section id="views">
    <div class="view-box">
      <h2>顶视图（单击/拖动设置安装点 · 拖动幕布与禁装区即时重算）</h2>
      <svg id="topView" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="view-box">
      <h2>侧视图（沿幕布墙剖面 · 拖动投影机调整镜头高度与距离）</h2>
      <svg id="sideView" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
